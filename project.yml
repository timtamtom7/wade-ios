name: Wade
options:
  bundleIdPrefix: com.wade
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    version: 0.15.3

targets:
  Wade:
    type: application
    platform: iOS
    sources:
      - Wade
    settings:
      base:
        INFOPLIST_FILE: Wade/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wade.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: SQLite
    entitlements:
      path: Wade/Resources/Wade.entitlements
      properties:
        com.apple.security.app-sandbox: true
